# Basic Dense Retrieval Configuration
# Minimal setup for getting started with dense retrieval

project:
  name: basic-dense-rag

documents:
  path: ./data/docs

chunking:
  strategy: recursive
  chunk_size: 512
  overlap: 64

embedding:
  provider: hash  # Use "sentence-transformers" for real embeddings
  model: BAAI/bge-base-en-v1.5  # Required for sentence-transformers

retrieval:
  strategy: dense
  top_k: 5

