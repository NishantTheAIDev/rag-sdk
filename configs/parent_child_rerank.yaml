# Parent-Child Retrieval with Reranking Configuration
# Uses hierarchical chunks (parent + child) with cross-encoder reranking

project:
  name: parent-child-rag

documents:
  path: ./data/docs

chunking:
  strategy: parent_child
  parent_chunk_size: 1024
  parent_overlap: 128
  child_chunk_size: 256
  child_overlap: 32

embedding:
  provider: hash
  model: BAAI/bge-base-en-v1.5

retrieval:
  strategy: hybrid
  top_k: 5                    # Final output after enrichment
  candidate_k: 50             # Retriever pool before reranking
  fusion:
    method: rrf
  parent_child:
    enabled: true             # Expand child hits to parent chunks

reranker:
  strategy: cross_encoder
  model: BAAI/bge-reranker-base
  top_k: 5                    # Output after reranking

