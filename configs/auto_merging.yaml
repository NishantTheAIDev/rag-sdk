# Auto-Merging Configuration
# Merges adjacent chunks from the same document based on embedding similarity

project:
  name: auto-merging-rag

documents:
  path: ./data/docs

chunking:
  strategy: recursive
  chunk_size: 256
  overlap: 32

embedding:
  provider: hash
  model: BAAI/bge-base-en-v1.5

retrieval:
  strategy: hybrid
  top_k: 5
  candidate_k: 50
  auto_merging:
    enabled: true
    similarity_threshold: 0.8   # Merge if cosine similarity >= 0.8
    max_tokens: 512             # Token limit for merged chunk
    max_chunks: 10
    tokenizer: whitespace       # whitespace | cl100k_base

