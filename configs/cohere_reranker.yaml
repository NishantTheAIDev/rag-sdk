# Cohere Reranker Configuration
# Uses Cohere's Rerank v4 API for reranking

project:
  name: cohere-rerank-rag

documents:
  path: ./data/docs

chunking:
  strategy: recursive
  chunk_size: 512
  overlap: 64

embedding:
  provider: hash
  model: BAAI/bge-base-en-v1.5

retrieval:
  strategy: hybrid
  top_k: 5
  candidate_k: 50
  fusion:
    method: rrf
  parent_child:
    enabled: true

reranker:
  strategy: cohere
  model: rerank-v4.0-fast
  api_key: ${COHERE_API_KEY}  # Set COHERE_API_KEY env var or use inline
  top_k: 5

# Install with: uv pip install -e ".[reranker]"